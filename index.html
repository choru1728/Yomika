<style>

/* Yomika — midnight ink theme. Dark is the default on every device. */
:root{color-scheme:dark;--bg:#101218;--panel:#1b2029;--panel2:#262c37;--ink:#f0f1f7;--muted:#a5aabd;--line:#333b49;--accent:#b9a4ec;--purple:#8e7cbb}
body{background:radial-gradient(ellipse at 90% -8%,#29233b 0%,transparent 43%),var(--bg);color:var(--ink)}
.shell{max-width:1200px;padding:34px 28px 70px}
.top{padding-bottom:25px;border-bottom:1px solid var(--line);align-items:center}
.logo{font-size:34px;letter-spacing:-.055em;font-weight:780;display:flex;align-items:center;gap:12px;color:#f6f3ff}
.brand-icon{font-size:24px;font-weight:400;color:#17121d;background:linear-gradient(135deg,#e6cff8,#a9a7f2);width:42px;height:42px;display:inline-flex;justify-content:center;align-items:center;border-radius:13px;letter-spacing:0;box-shadow:0 5px 25px #a594db36}
.brand-dot{color:var(--accent);margin-left:-11px}
.sub{font-size:10px;letter-spacing:.19em;font-weight:600;margin-left:54px;margin-top:2px;color:#9298ac}
.actions{gap:8px}.btn{background:#242a35;border-color:#3d4656;color:#e5e7ef;border-radius:12px;font-size:13px;min-height:43px;padding:10px 14px;transition:background .16s,border-color .16s}.btn:hover{background:#303747;border-color:#77708f}
.btn.primary,.primary{background:#b9a4ec;border-color:#b9a4ec;color:#19151e;font-weight:800}.btn.primary:hover{background:#d4bef7}.danger{color:#ffb1b9}
.toolbar{background:#1b2029;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 32px #0002;margin:27px 0 24px;padding:13px;gap:9px}
.toolbar input,.toolbar select,.field input,.field select,.field textarea,.readerControls input{background:#131821;border:1px solid #41495a;color:var(--ink);border-radius:10px;min-height:43px}
.toolbar input::placeholder,.field input::placeholder{color:#858ca0}.toolbar input{flex:3 1 240px;padding-left:14px}.toolbar select{flex:1 1 140px}
.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:14px;margin:0 0 15px}.sectionhead h2{font-size:22px;font-weight:760;letter-spacing:-.04em;margin:4px 0 0}.eyebrow{font-size:10px;color:#b2a2e3;letter-spacing:.2em;font-weight:750}.sectionnote{font-size:12px;color:#9aa1b4}
.counts{float:right;margin:-13px 1px 20px;color:var(--muted);font-size:12px}

.cover{border-radius:10px;box-shadow:0 10px 22px #0006;aspect-ratio:3/4;background:linear-gradient(150deg,#555069,#302b46 55%,#1b2534);border:1px solid #484658}
.cover img{border-radius:9px}.placeholder{color:#ded7ff;font-size:32px}.placeholder span{color:#e2dded;font-size:12px}
.pill{left:9px;top:9px;background:#191c28e8;border:1px solid #555367;color:#d7c9ff;font-weight:750;border-radius:7px;padding:5px 8px;box-shadow:0 2px 4px #0003}
.bookdata{padding:12px 3px}.booktitle{font-size:13px;font-weight:700;color:#f0eef9;line-height:1.5;min-height:39px}.meta{font-size:11px;color:#a2a9ba}.progress{background:#343a48;margin-top:10px;height:4px}.progress>div{background:#b9a4ec}
.empty{clear:both;background:#1a1f28;border:1px dashed #4b4d63;border-radius:18px;padding:85px 16px;color:#a8aabd}.empty b{color:#f0ecfa}
.overlay{background:#080a10dc;backdrop-filter:blur(6px)}.dialog{background:#1d222d;border-color:#43495c;border-radius:20px;box-shadow:0 15px 60px #0009}.dialoghead h2{color:#f0eff8}.small{color:#a9aebe}.readerArea{background:#11151c}.drop{background:#242134;border-color:#8f7cbf}.drop.over{background:#38304d}a{color:#cbb7ff}.toast{background:#d9c6ff;color:#241930}.readerControls input{background:#131821}
@media(max-width:640px){.shell{padding:21px 16px 52px}.top{gap:17px;padding-bottom:20px}.logo{font-size:30px}.brand-icon{width:36px;height:36px;font-size:20px}.sub{margin-left:48px;font-size:9px}.top .actions{display:grid;grid-template-columns:1fr 1fr;width:100%;gap:7px}.top .actions .primary{grid-column:1/-1;grid-row:1}.top .actions .btn{flex:initial;min-height:42px}.toolbar{margin:20px 0 20px;padding:9px}.toolbar input{flex-basis:100%;width:100%}.toolbar select{flex-basis:42%;width:42%;font-size:12px;padding:9px 6px}.sectionhead{align-items:center}.sectionhead h2{font-size:19px}.sectionnote{display:none}.counts{float:none;margin:-7px 0 14px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:17px 10px}.bookdata{padding:8px 1px}.booktitle{font-size:11px;min-height:33px}.meta{font-size:10px}.pill{font-size:9px;padding:4px 5px;top:6px;left:6px}.cover{border-radius:8px}.cover img{border-radius:8px}}
@media(prefers-reduced-motion:reduce){.book,.btn{transition:none}}
</style></head><body>
<div class="shell"><header class="top"><div><h1 class="logo"><span class="brand-icon">▤</span> Yomika<span class="brand-dot">.</span></h1><div class="sub">YOUR PERSONAL PDF LIBRARY</div></div><div class="actions"><button class="btn" id="backupBtn">↓ 書き出す</button><button class="btn" id="restoreBtn">↑ 読み込む</button><button class="btn primary" id="addBtn">＋ 本を追加</button></div></header>
<div class="card toolbar"><input id="search" placeholder="本を検索（タイトル・作者・タグ）" aria-label="検索"><select id="category"><option value="">すべてのカテゴリ</option></select><select id="status"><option value="">すべての読書状態</option><option value="unread">未読</option><option value="reading">読書中</option><option value="done">読了</option></select><select id="sort"><option value="recent">最近追加した順</option><option value="opened">最近読んだ順</option><option value="title">タイトル順</option></select></div><div class="counts" id="counts">読み込み中…</div><div class="sectionhead"><div><div class="eyebrow">COLLECTION</div><h2>マイライブラリ</h2></div><span class="sectionnote">お気に入りの本を、ひとつの場所に。</span></div><main id="books" class="grid"></main><div class="small" style="margin-top:28px">※ 本は端末ごとのブラウザ保存領域に保持されます。キャッシュやサイトデータの削除で消えることがあるため、定期的にバックアップしてください。PCとiPhoneは自動同期されません。</div></div>
<input id="pdfInput" type="file" accept="application/pdf,.pdf" multiple hidden><input id="restoreInput" type="file" accept=".mayalib,application/octet-stream" hidden><input id="coverInput" type="file" accept="image/*" hidden>
<div id="modalRoot"></div><div id="toast" class="toast hidden" role="status"></div>
<script type="module">
const $=s=>document.querySelector(s), root=$('#modalRoot');let db,books=[],active=null,reader=null,coverTarget=null;let pdfjs=null;let currentPdf=null;let renderTask=null;let currentBlobUrl=null;let toastTimer;
const CDN='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs';
const WORKER='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),3600)}
function openDB(){return new Promise((resolve,reject)=>{let req=indexedDB.open('maya-secret-library',1);req.onupgradeneeded=()=>{const db=req.result;db.createObjectStore('books',{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function transaction(mode,fn){return new Promise((resolve,reject)=>{const tx=db.transaction('books',mode),store=tx.objectStore('books');let req=fn(store);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);tx.onerror=()=>reject(tx.error)})}
const all=()=>transaction('readonly',s=>s.getAll());const get=id=>transaction('readonly',s=>s.get(id));const put=book=>transaction('readwrite',s=>s.put(book));const del=id=>transaction('readwrite',s=>s.delete(id));
const uid=()=>globalThis.crypto?.randomUUID?.()||`${Date.now()}-${Math.random()}`;
function refresh(){const q=$('#search').value.toLocaleLowerCase().trim(),c=$('#category').value,st=$('#status').value,sort=$('#sort').value;const cats=[...new Set(books.map(b=>b.category).filter(Boolean))].sort();const old=c;$('#category').innerHTML='<option value="">すべてのカテゴリ</option>'+cats.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');$('#category').value=old;
const shown=books.filter(b=>(!c||b.category===c)&&(!q||[b.title,b.author,b.category,b.tags,b.memo].join(' ').toLocaleLowerCase().includes(q))&&(!st||statusOf(b)===st)).sort((a,b)=>sort==='title'?a.title.localeCompare(b.title,'ja'):sort==='opened'?(b.lastOpened||0)-(a.lastOpened||0):(b.added||0)-(a.added||0));$('#counts').textContent=`${shown.length} 冊表示 ／ 全 ${books.length} 冊`;
const el=$('#books');if(!shown.length){el.className='';el.innerHTML='<div class="empty">📚<b>まだ本がありません</b>「＋ 本を追加」から本棚を作ろう！</div>';return}el.className='grid';el.innerHTML=shown.map(b=>{const pct=b.pageCount?Math.min(100,Math.round((b.page||0)/b.pageCount*100)):0;return `<button class="book" data-id="${esc(b.id)}" aria-label="${esc(b.title)}"><div class="cover">${b.cover?`<img src="${b.cover}" alt="">`:`<div class="placeholder">✦<span>${esc(b.category||'PDF')}</span></div>`}<span class="pill">${statusOf(b)==='done'?'読了':statusOf(b)==='reading'?'読書中':'未読'}</span></div><div class="bookdata"><div class="booktitle">${esc(b.title)}</div><div class="meta">${esc(b.author||b.category||'作者未設定')}</div><div class="progress"><div style="width:${pct}%"></div></div></div></button>`}).join('');el.querySelectorAll('.book').forEach(node=>node.addEventListener('click',()=>showDetail(node.dataset.id)))}
function statusOf(b){if(b.done)return'done';if((b.page||0)>1)return'reading';return'unread'}async function reload(){books=await all();refresh()}
async function loadPdfjs(){if(pdfjs)return pdfjs;try{pdfjs=await import(CDN);pdfjs.GlobalWorkerOptions.workerSrc=WORKER;return pdfjs}catch(e){console.warn(e);return null}}
async function pdfLoad(blob){const p=await loadPdfjs();if(!p)throw Error('PDF描画ライブラリを読み込めません。ネット接続を確認してください。');const buffer=await blob.arrayBuffer();return await p.getDocument({data:new Uint8Array(buffer)}).promise}
async function thumb(blob){try{const pdf=await pdfLoad(blob),page=await pdf.getPage(1),viewport=page.getViewport({scale:1});const canvas=document.createElement('canvas'),ratio=Math.min(280/viewport.width,370/viewport.height);canvas.width=Math.round(viewport.width*ratio);canvas.height=Math.round(viewport.height*ratio);await page.render({canvasContext:canvas.getContext('2d'),viewport:page.getViewport({scale:ratio})}).promise;const data=canvas.toDataURL('image/jpeg',.68);return {data,count:pdf.numPages}}catch(e){console.warn(e);return {data:null,count:null}}}
async function addFiles(files){let fs=[...files].filter(f=>/\.pdf$/i.test(f.name)||f.type==='application/pdf');if(!fs.length){toast('PDFファイルを選んでね');return}toast(`${fs.length}件を追加中…`);for(const f of fs){try{const b={id:uid(),title:f.name.replace(/\.pdf$/i,''),author:'',category:'未分類',tags:'',memo:'',blob:f,cover:null,page:1,pageCount:0,added:Date.now(),lastOpened:0,done:false};await put(b)}catch(e){toast('保存できませんでした。端末の空き容量を確認してください');console.error(e);break}}await reload();toast(`${fs.length}件のPDFを追加しました。表紙は開いたときに生成できます`)}
function modal(body,wide=false){root.innerHTML=`<div class="overlay"><section class="dialog ${wide?'wide':''}" role="dialog" aria-modal="true">${body}</section></div>`;root.querySelector('.overlay').addEventListener('click',e=>{if(e.target.classList.contains('overlay'))closeModal()})}
function closeModal(){if(renderTask){try{renderTask.cancel()}catch{}}if(currentBlobUrl){URL.revokeObjectURL(currentBlobUrl);currentBlobUrl=null}currentPdf=null;reader=null;root.innerHTML=''}
async function showDetail(id){let b=await get(id);if(!b)return;active=id;modal(`<div class="dialoghead"><h2>📖 ${esc(b.title)}</h2><button class="btn" id="x">閉じる</button></div><div class="fields"><label class="field full">タイトル<input id="dTitle" value="${esc(b.title)}"></label><label class="field">作者・サークル<input id="dAuthor" value="${esc(b.author)}"></label><label class="field">カテゴリ<input id="dCategory" list="catHints" value="${esc(b.category)}"><datalist id="catHints"><option value="成人向け"><option value="TRPG"><option value="漫画"><option value="創作資料"><option value="小説"></datalist></label><label class="field full">タグ（カンマ区切り）<input id="dTags" value="${esc(b.tags)}" placeholder="CoC6, ソロ, お気に入り"></label><label class="field full">メモ<textarea rows="3" id="dMemo">${esc(b.memo)}</textarea></label></div><div class="small">${b.pageCount?`全${b.pageCount}ページ ・ `:''}前回のページ：${b.page||1} ／ ${b.done?'読了':'未読・読書中'}</div><div class="actions" style="margin-top:15px"><button class="btn primary" id="read">▶ 読む</button><button class="btn" id="save">変更を保存</button><button class="btn" id="makeCover">表紙を生成</button><button class="btn" id="customCover">表紙画像を選ぶ</button><button class="btn" id="markDone">${b.done?'未読に戻す':'読了にする'}</button><button class="btn danger" id="delete">削除</button></div><p class="small">「表紙を生成」は初回にネット接続が必要です。表紙画像を直接指定することもできます。</p>`);
$('#x').onclick=closeModal;$('#read').onclick=()=>showReader(id);$('#save').onclick=async()=>{b.title=$('#dTitle').value.trim()||b.title;b.author=$('#dAuthor').value.trim();b.category=$('#dCategory').value.trim()||'未分類';b.tags=$('#dTags').value.trim();b.memo=$('#dMemo').value.trim();await put(b);await reload();toast('保存しました');closeModal()};$('#markDone').onclick=async()=>{b.done=!b.done;await put(b);await reload();showDetail(id)};$('#delete').onclick=async()=>{if(confirm(`「${b.title}」を削除しますか？`)){await del(id);await reload();closeModal()}};$('#customCover').onclick=()=>{coverTarget=id;$('#coverInput').click()};$('#makeCover').onclick=async()=>{toast('表紙を生成中…');const t=await thumb(b.blob);if(t.data){b.cover=t.data;b.pageCount=t.count;await put(b);await reload();showDetail(id);toast('表紙を作りました')}else toast('生成できませんでした。画像を選ぶこともできます')}}
async function showReader(id){let b=await get(id);if(!b)return;active=id;b.lastOpened=Date.now();await put(b);await reload();modal(`<div class="dialoghead"><h2>${esc(b.title)}</h2><button class="btn" id="readerClose">本棚へ</button></div><div class="readerControls"><button class="btn" id="prev">← 前</button><span><input type="number" id="page" min="1" value="${b.page||1}" aria-label="ページ"> / <span id="total">${b.pageCount||'?'}</span></span><button class="btn" id="next">次 →</button><button class="btn" id="fit">幅に合わせる</button><button class="btn" id="native">標準ビューア</button></div><div class="readerArea" id="readerArea"><div class="loading">PDFを読み込み中…</div></div><p class="small" id="readerHint">ページを移動すると自動保存します。左右の矢印キーでも操作できます。</p>`,true);$('#readerClose').onclick=()=>{closeModal();showDetail(id)};reader={book:b,page:b.page||1,zoom:1,native:false,loading:false};$('#prev').onclick=()=>goPage(-1);$('#next').onclick=()=>goPage(1);$('#page').onchange=()=>goPageTo(Number($('#page').value));$('#fit').onclick=()=>{if(reader){reader.zoom=1;renderPage()}};$('#native').onclick=()=>openNative();window.addEventListener('keydown',keyHandler);try{currentPdf=await pdfLoad(b.blob);if(!reader||reader.book.id!==id)return;reader.book.pageCount=currentPdf.numPages;$('#total').textContent=currentPdf.numPages;reader.page=Math.min(reader.page,currentPdf.numPages);if(!b.cover){const t=await thumb(b.blob);if(t.data)reader.book.cover=t.data}await put(reader.book);await reload();await renderPage()}catch(e){if(reader){$('#readerHint').textContent='専用ビューアを利用できないため、標準PDFビューアに切り替えました。標準ビューアではページ位置の自動記録はできません。';openNative();toast('PDF描画が利用できないため標準表示に切り替えました')}}}
function keyHandler(e){if(!reader||['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;if(e.key==='ArrowRight')goPage(1);if(e.key==='ArrowLeft')goPage(-1)}
async function goPage(delta){if(reader&&!reader.native)await goPageTo(reader.page+delta)}async function goPageTo(n){if(!reader||!currentPdf)return;reader.page=Math.max(1,Math.min(currentPdf.numPages,Math.trunc(n)||1));reader.book.page=reader.page;reader.book.done=reader.page===currentPdf.numPages;reader.book.lastOpened=Date.now();$('#page').value=reader.page;await put(reader.book);await renderPage()}
async function renderPage(){if(!reader||!currentPdf||reader.native)return;const id=reader.book.id,pageNum=reader.page,area=$('#readerArea');if(!area)return;const page=await currentPdf.getPage(pageNum);if(!reader||reader.book.id!==id||reader.page!==pageNum)return;const base=page.getViewport({scale:1});let width=Math.max(280,Math.min(1100,area.clientWidth-22));const scale=Math.min(2.5,width/base.width)*reader.zoom;const viewport=page.getViewport({scale});const dpr=Math.min(2,window.devicePixelRatio||1);const canvas=document.createElement('canvas');canvas.width=Math.round(viewport.width*dpr);canvas.height=Math.round(viewport.height*dpr);canvas.style.width=`${viewport.width}px`;canvas.style.maxWidth='none';canvas.style.height=`${viewport.height}px`;if(renderTask){try{renderTask.cancel()}catch{}}area.replaceChildren(canvas);renderTask=page.render({canvasContext:canvas.getContext('2d'),viewport,transform:dpr!==1?[dpr,0,0,dpr,0,0]:null});try{await renderTask.promise}catch(e){if(e.name!=='RenderingCancelledException')console.warn(e)}area.scrollTop=0;area.scrollLeft=0}
function openNative(){if(!reader)return;reader.native=true;const a=$('#readerArea');if(!a)return;currentBlobUrl=URL.createObjectURL(reader.book.blob);const iframe=document.createElement('iframe');iframe.title='PDF標準ビューア';iframe.src=currentBlobUrl;a.replaceChildren(iframe);$('#prev').disabled=true;$('#next').disabled=true;$('#page').disabled=true;$('#fit').disabled=true;$('#readerHint').textContent='標準表示では読書位置は自動記録されません。iPhoneでは標準ビューアが別画面で開く場合があります。'}
function strBytes(s){return new TextEncoder().encode(s)}function readString(bytes){return new TextDecoder().decode(bytes)}
async function backup(){if(!books.length){toast('バックアップする本がありません');return}toast('バックアップを作成しています…');try{let offsets=[],off=0;const parts=[];for(const b of books){offsets.push({id:b.id,offset:off,size:b.blob.size,meta:{...b,blob:undefined}});parts.push(b.blob);off+=b.blob.size}const header=strBytes(JSON.stringify({format:'maya-library',version:1,books:offsets}));const length=new DataView(new ArrayBuffer(8));length.setBigUint64(0,BigInt(header.length),true);const blob=new Blob([strBytes('MAYALIB1'),length.buffer,header,...parts],{type:'application/octet-stream'});download(blob,`yomika-backup-${new Date().toISOString().slice(0,10)}.mayalib`);toast('バックアップファイルを保存しました')}catch(e){console.error(e);toast('バックアップに失敗しました')}}
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
async function restore(file){try{const h=new Uint8Array(await file.slice(0,16).arrayBuffer());if(readString(h.slice(0,8))!=='MAYALIB1')throw Error('専用バックアップ形式ではありません');const size=Number(new DataView(h.buffer).getBigUint64(8,true));if(size>100000000)throw Error('ヘッダーが大きすぎます');const data=JSON.parse(await file.slice(16,16+size).text());if(data.format!=='maya-library'||data.version!==1)throw Error('未対応の形式です');const start=16+size;let n=0;for(const item of data.books){if(!Number.isSafeInteger(item.offset)||!Number.isSafeInteger(item.size)||start+item.offset+item.size>file.size)throw Error('破損したファイルです');let blob=file.slice(start+item.offset,start+item.offset+item.size,'application/pdf');await put({...item.meta,id:item.meta.id||uid(),blob});n++}await reload();toast(`${n}冊を復元しました（同じIDの本は上書き）`)}catch(e){console.error(e);toast('復元失敗：'+e.message)}}
$('#addBtn').onclick=()=>$('#pdfInput').click();$('#pdfInput').onchange=async e=>{await addFiles(e.target.files);e.target.value=''};$('#backupBtn').onclick=backup;$('#restoreBtn').onclick=()=>$('#restoreInput').click();$('#restoreInput').onchange=async e=>{if(e.target.files[0])await restore(e.target.files[0]);e.target.value=''};
$('#coverInput').onchange=async e=>{const f=e.target.files[0];if(f&&coverTarget){const b=await get(coverTarget);if(b){const img=new Image(),url=URL.createObjectURL(f);try{await new Promise((yes,no)=>{img.onload=yes;img.onerror=no;img.src=url});const cv=document.createElement('canvas'),ratio=Math.min(360/img.width,480/img.height,1);cv.width=Math.max(1,Math.round(img.width*ratio));cv.height=Math.max(1,Math.round(img.height*ratio));cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);b.cover=cv.toDataURL('image/jpeg',.75);await put(b);await reload();showDetail(b.id);toast('表紙を変更しました')}catch{toast('画像を読み込めませんでした')}finally{URL.revokeObjectURL(url)}}}e.target.value=''};
for(const id of ['search','category','status','sort'])$('#'+id).addEventListener('input',refresh);
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&root.innerHTML)closeModal()});
(async()=>{try{db=await openDB();await reload()}catch(e){console.error(e);$('#counts').textContent='保存領域が利用できません。Safariのプライベートブラウズやブラウザ設定を確認してください。';toast('ブラウザの保存機能を利用できません')}})();
</script></body></html>
